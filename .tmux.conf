### Terminal / color ###
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -ag update-environment "COLORTERM"

### Responsiveness ###
set -sg escape-time 10
set -g focus-events on

### History / mouse ###
set -g history-limit 50000
set -g mouse on

### Clipboard (OSC52 passthrough) ###
set -s set-clipboard on

### Window/pane numbering & titles ###
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#T"
set -g aggressive-resize on

### Attention alerts for background sessions ###
setw -g monitor-activity on
setw -g monitor-bell on
set -g visual-activity on
set -g visual-bell off
set -g bell-action any

### Status bar ###
set -g status-interval 5
set -g status-style bg=colour234,fg=colour137
set -g window-status-current-style bg=colour238,fg=colour81,bold
setw -g window-status-activity-style bg=colour1,fg=colour231,bold
setw -g window-status-bell-style bg=colour1,fg=colour231,bold
set -g status-left-length 20
set -g status-left "#[fg=colour81,bold]#S "
set -g status-right "#[fg=colour137]%H:%M "

### Pane splits open in the current pane's directory ###
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

### vi-style pane navigation (prefix + h/j/k/l) ###
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

### Copy mode ###
setw -g mode-keys vi

### Reload config ###
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
